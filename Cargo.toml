[package]
name = "llm-wiki-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

[workspace]
members = []
resolver = "2"

[workspace.package]
version = "0.2.15"
edition = "2024"
license = "MIT"
repository = "https://github.com/nicolasmartino/llm-wiki-rs"

[workspace.dependencies]
anyhow = "1.0"
askama = "0.16"
assert_cmd = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
inquire = "0.9.4"
indicatif = "0.18.6"
insta = { version = "1.41", features = ["filters", "glob"] }
predicates = "3.1"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies]
anyhow.workspace = true
askama.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
inquire.workspace = true
indicatif.workspace = true
qmd = "0.3.2"
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.1", features = ["blocking"] }
rusqlite = "0.38"
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Vendored qmd 0.3.2 with load-bearing patches: `llama-cpp-2` default features
# disabled AND an added RuntimeBackend/RuntimeOptions CPU-fallback API that
# src/search/gguf_runtime.rs depends on. Do NOT swap back to the crates.io crate
# without porting those call sites. See vendor/qmd-0.3.2/PATCH-NOTES.md for the
# full diff, license status, and native build deps (clang/cmake/libclang).
[patch.crates-io]
qmd = { path = "vendor/qmd-0.3.2" }

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
tempfile.workspace = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
