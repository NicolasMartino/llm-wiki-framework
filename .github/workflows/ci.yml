name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D dead_code
      - uses: taiki-e/install-action@just
      - name: No Legacy Audit
        run: just audit-legacy
      - name: Test
        run: cargo test --workspace
      - name: Snapshot Tests
        run: cargo insta test --workspace --check
      - name: Coverage
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage Gate
        run: cargo llvm-cov --workspace --fail-under-lines 80

  udeps:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2026-05-01
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      - name: Unused Dependency Audit
        run: cargo +nightly-2026-05-01 udeps --workspace
