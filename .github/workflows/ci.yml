name: CI

# The full CI, on the way to master: the PR from develop into master, and
# master itself. Run it on any branch by hand with workflow_dispatch. PRs into
# develop get the fast check instead (fast-check.yml).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-insta,ripgrep,cargo-llvm-cov
      - name: Verify
        run: just verify
      - name: Coverage Gate
        run: just coverage

  udeps:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      - name: Unused Dependency Audit
        run: cargo +nightly-2026-05-01 udeps --workspace
