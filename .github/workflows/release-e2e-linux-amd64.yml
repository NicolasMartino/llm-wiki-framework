name: Release E2E Linux amd64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-e2e-linux-amd64.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "assets/**"
      - "crates/**"
      - "justfile"
      - "src/**"
      - "templates/**"
      - "tools/release-e2e/**"
      - "vendor/**"

jobs:
  native-linux-amd64:
    name: native archive product story
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-e2e-linux-amd64
      - uses: taiki-e/install-action@just
      - name: Assert native Linux amd64 host
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev pkg-config
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
      - name: Run native Linux amd64 release E2E
        run: just release-e2e-native-linux-dist-build-and-test
      - name: Inspect native release report
        if: always()
        run: |
          report="target/release-e2e-native-linux-amd64/search/report.json"
          if [ ! -f "$report" ]; then
            echo "::warning::native release E2E report was not produced"
            find target -maxdepth 4 -type f | sort || true
            exit 0
          fi
          jq '.success, .schema_version, .target_triple, .host_os, .host_arch, .package_sha256, (.commands | length), (.assertions | length), [.assertions[] | select(.passed == false)]' "$report"
          artifact_path="$(jq -r '.artifact_path' "$report")"
          ldd "$artifact_path"
          "$artifact_path" --version
      - name: Upload release E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-linux-amd64-native
          path: |
            target/release-e2e-native-linux-amd64/
            target/release-e2e-native-linux-amd64-dist/dist-manifest.json
            target/release-e2e-native-linux-amd64-dist/distrib/llm-wiki-rs-x86_64-unknown-linux-gnu.tar.xz
            target/release-e2e-native-linux-amd64-dist/distrib/llm-wiki-rs-x86_64-unknown-linux-gnu.tar.xz.sha256
          if-no-files-found: warn
