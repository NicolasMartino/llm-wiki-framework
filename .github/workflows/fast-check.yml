name: Fast Check

# Work PRs into develop, and their merges there, get one fast Linux check:
# `just fast-check`, which is `just verify` without the slow test files, and
# `just strict`, the strictest gates over the strict crates. The full CI
# (ci.yml) runs everything on the way to master.
#
# The cache: only pushes to develop and master save one (`save-if`), and a PR
# only restores it. A PR's first run restores the cache develop's last push
# saved for the same job, so it starts as warm as develop. Keep the job ids:
# they are the cache keys.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  fast-check:
    name: just fast-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain and its components; rustup
      # installs exactly that.
      - name: Install the pinned toolchain
        run: |
          # rust-cache keys on every installed toolchain: drop the runner
          # image's own, so an image update does not change the key.
          rustup toolchain list --quiet | while read -r t; do rustup toolchain uninstall "$t"; done
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-insta,ripgrep
      - name: Fast check
        run: just fast-check

  strict:
    name: just strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and the dated nightly
        run: |
          # rust-cache keys on every installed toolchain: drop the runner
          # image's own, so an image update does not change the key.
          rustup toolchain list --quiet | while read -r t; do rustup toolchain uninstall "$t"; done
          rustup toolchain install
          rustup toolchain install "$(tr -d '[:space:]' < tools/udeps-nightly)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov,cargo-mutants,cargo-deny,cargo-udeps
      - name: Strict gates
        run: just strict
